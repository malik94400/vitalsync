name: VitalSync CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      - name: Run Jest tests
        working-directory: ./backend
        run: npm test

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build backend image
        run: docker build -t ghcr.io/${{ env.OWNER_LC }}/vitalsync-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t ghcr.io/${{ env.OWNER_LC }}/vitalsync-frontend:${{ github.sha }} ./frontend

      - name: Push backend image
        run: docker push ghcr.io/${{ env.OWNER_LC }}/vitalsync-backend:${{ github.sha }}

      - name: Push frontend image
        run: docker push ghcr.io/${{ env.OWNER_LC }}/vitalsync-frontend:${{ github.sha }}

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env

      - name: Start services in staging
        run: docker compose up -d --build

      - name: Wait for backend startup
        run: sleep 10

      - name: Health check
        run: curl --fail http://localhost:3000/health

      - name: Stop services
        if: always()
        run: docker compose down